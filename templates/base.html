<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Contrarian{% endblock %}</title>
<style>
:root {
  --bg: #faf9f6; --fg: #1a1a1a; --muted: #666; --card: #ffffff;
  --border: #ddd; --accent: #8a1f1f; --code-bg: #f4f2ee; --ok: #2e7d32;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16161a; --fg: #e8e6e3; --muted: #999; --card: #1f1f24;
    --border: #333; --accent: #d4766a; --code-bg: #121215; --ok: #7cb342;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 16px/1.6 Georgia, 'Times New Roman', serif;
}
header {
  border-bottom: 1px solid var(--border); padding: 1rem 2rem;
  display: flex; align-items: baseline; gap: 1.5rem; flex-wrap: wrap;
}
header h1 { font-size: 1.3rem; margin: 0; }
header h1 a { color: var(--fg); text-decoration: none; }
header .tagline { color: var(--muted); font-style: italic; font-size: .95rem; }
nav { margin-left: auto; display: flex; gap: 1rem; font-size: .9rem; }
nav a { color: var(--accent); text-decoration: none; }
main { max-width: 62rem; margin: 0 auto; padding: 2rem; }
footer {
  border-top: 1px solid var(--border); color: var(--muted);
  font-size: .8rem; padding: 1rem 2rem; margin-top: 3rem;
}
footer code { font-size: .8rem; }
a { color: var(--accent); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr)); gap: 1rem; }
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: 6px;
  padding: 1rem 1.2rem; display: block; text-decoration: none; color: var(--fg);
}
.card:hover { border-color: var(--accent); }
.card h3 { margin: 0 0 .3rem; font-size: 1.05rem; }
.card p { margin: 0; color: var(--muted); font-size: .9rem; }
.badge {
  display: inline-block; font: .7rem/1.4 monospace; padding: 0 .5em;
  border: 1px solid var(--border); border-radius: 3px; color: var(--muted);
  margin-bottom: .5rem; text-transform: uppercase; letter-spacing: .05em;
}
.badge.tool { border-color: var(--accent); color: var(--accent); }
.badge.prompt { border-color: var(--ok); color: var(--ok); }
pre {
  background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px;
  padding: 1rem; overflow-x: auto; font-size: .82rem; line-height: 1.5;
}
code { font-family: ui-monospace, Consolas, monospace; }
.recap { white-space: pre-wrap; background: var(--card); border-left: 3px solid var(--accent);
  padding: .8rem 1.2rem; margin: 1rem 0; font-size: .95rem; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: .5rem .8rem; border-bottom: 1px solid var(--border); }
th { color: var(--muted); font-weight: normal; font-variant: small-caps; }
input[type=text], input[type=password] {
  background: var(--card); color: var(--fg); border: 1px solid var(--border);
  border-radius: 4px; padding: .4rem .6rem; font-size: .95rem;
}
button {
  background: var(--accent); color: #fff; border: 0; border-radius: 4px;
  padding: .4rem 1rem; cursor: pointer; font-size: .9rem;
}
.muted { color: var(--muted); }
.event { border: 1px solid var(--border); border-radius: 6px; margin: .8rem 0;
  background: var(--card); }
.event summary { padding: .6rem 1rem; cursor: pointer; }
.event .body { padding: 0 1rem 1rem; }
.verdict { font-variant: small-caps; letter-spacing: .05em; }
blockquote { border-left: 3px solid var(--border); margin: .5rem 0; padding: .2rem 1rem;
  color: var(--muted); font-style: italic; }
</style>
</head>
<body>
<header>
  <h1><a href="/">Contrarian</a></h1>
  <span class="tagline">claim verification with the reasoning kept visible</span>
  <nav>
    <a href="/">catalog</a>
    {% if is_admin %}<a href="/runs">traces</a><a href="/admin">keys</a><a href="/logout">logout</a>
    {% else %}<a href="/login">login</a>{% endif %}
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
<footer>
  what you read here is what runs — deployed commit <code>{{ commit }}</code>
  · source: <a href="https://github.com/that-ugly-cat/contrarian">github.com/that-ugly-cat/contrarian</a>
  · a <a href="https://borant.eu">borant</a> tool
</footer>
</body>
</html>
