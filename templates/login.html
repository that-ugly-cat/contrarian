{% extends "base.html" %}
{% block content %}
<div class="login-card">
  <div class="title">Login</div>
  <div class="sub">The catalog and the protocol are public. Traces and key
  management are content, not method — they need the admin password.</div>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <label for="password">admin password</label>
    <input type="password" id="password" name="password" style="width:100%" autofocus>
    <button type="submit" style="width:100%;margin-top:1.2rem">Enter</button>
  </form>
</div>
{% endblock %}
